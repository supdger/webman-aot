<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">从业务项目到 Linux 构建产物</title>
  <desc id="desc">Webman 或 SaiAdmin 项目，在 Mac ARM64 或 Windows x64 开发机上通过 webman-aot build 构建，生成包含全静态程序和外置资源的 dist-aot 目录，部署到 Linux amd64。</desc>
  <rect width="960" height="250" rx="20" fill="#0f172a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="24" y="30" width="260" height="190" rx="15" fill="#1e293b" stroke="#475569"/>
    <text x="48" y="73" fill="#f8fafc" font-size="22" font-weight="700">你的业务项目</text>
    <text x="48" y="116" fill="#cbd5e1" font-size="18" font-weight="600">Webman / SaiAdmin</text>
    <text x="48" y="159" fill="#94a3b8" font-size="17">同一套 PHP 代码</text>

    <rect x="350" y="30" width="260" height="190" rx="15" fill="#164e63" stroke="#22d3ee"/>
    <text x="374" y="73" fill="#ecfeff" font-size="20" font-weight="700">webman-aot build</text>
    <text x="374" y="116" fill="#cffafe" font-size="17" font-weight="600">Mac ARM64 / Windows x64</text>
    <text x="374" y="159" fill="#a5f3fc" font-size="17">先安装，再在项目中构建</text>

    <rect x="676" y="30" width="260" height="190" rx="15" fill="#14532d" stroke="#22c55e"/>
    <text x="700" y="73" fill="#f0fdf4" font-size="22" font-weight="700">dist-aot/</text>
    <text x="700" y="116" fill="#dcfce7" font-size="18" font-weight="600">Linux amd64 全静态</text>
    <text x="700" y="159" fill="#bbf7d0" font-size="17">ELF + 外置配置与资源</text>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 125h40m-12-12 12 12-12 12"/>
    <path d="M622 125h40m-12-12 12 12-12 12"/>
  </g>
</svg>
