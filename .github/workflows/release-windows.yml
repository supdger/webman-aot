name: Build fixed Windows release packages

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full clean release commit SHA
        required: true
        type: string
      version:
        description: Expected source version
        required: true
        default: '0.3.0'
        type: string

permissions:
  contents: read

jobs:
  windows-packages:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Build and verify both packages at the exact revision
        shell: powershell
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          & .\tools\build-release-windows.ps1 `
            -Revision $env:RELEASE_REVISION `
            -ExpectedVersion $env:RELEASE_VERSION `
            -Output (Join-Path $env:RUNNER_TEMP 'release-packages')
          if ($LASTEXITCODE -ne 0) { throw "Release packages failed: $LASTEXITCODE" }
      - name: Preserve actual packages and original machine results
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ inputs.version }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 7
