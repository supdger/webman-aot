name: Build fixed Windows release packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build packages or verify exact setup consumers
        required: true
        default: build
        type: choice
        options:
          - build
          - verify-draft
          - verify-public
      checksums_sha256:
        description: Accepted SHA256SUMS digest (required for verification)
        required: false
        type: string
      revision:
        description: Full clean release commit SHA
        required: true
        type: string
      version:
        description: Expected source version
        required: true
        default: '0.4.0'
        type: string
      native_build_revision:
        description: Native package build commit (defaults to checkout revision)
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-packages:
    if: inputs.operation == 'build'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Parse the complete release helper with native PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($helper in @('build-release-windows.ps1','verify-release-windows.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD ('tools\'+$helper)),
              [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          Write-Host 'Native PowerShell syntax passed for both complete release helpers.'
      - name: Build and verify both packages at the exact revision
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          & .\tools\build-release-windows.ps1 `
            -Revision $env:RELEASE_REVISION `
            -ExpectedVersion $env:RELEASE_VERSION `
            -Output (Join-Path $env:RUNNER_TEMP 'release-packages')
          if ($LASTEXITCODE -ne 0) { throw "Release packages failed: $LASTEXITCODE" }
      - name: Preserve actual packages and original machine results
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ inputs.version }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 7

  windows-consumers:
    permissions:
      contents: write
    if: inputs.operation != 'build'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify exact draft or public setup on private installations
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SUMS_SHA256: ${{ inputs.checksums_sha256 }}
          NATIVE_BUILD_REVISION: ${{ inputs.native_build_revision }}
        run: |
          $mode = if ($env:RELEASE_OPERATION -eq 'verify-draft') { 'draft' } else { 'public' }
          & .\tools\verify-release-windows.ps1 `
            -Revision $env:RELEASE_REVISION -NativeBuildRevision $env:NATIVE_BUILD_REVISION -Version $env:RELEASE_VERSION `
            -Mode $mode -ChecksumsSha256 $env:RELEASE_SUMS_SHA256 `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'release-consumer')
          if ($LASTEXITCODE -ne 0) { throw "Release consumer verification failed: $LASTEXITCODE" }
      - name: Preserve consumer results and local diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-consumer-${{ inputs.operation }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-consumer/logs/
          if-no-files-found: warn
          retention-days: 7
