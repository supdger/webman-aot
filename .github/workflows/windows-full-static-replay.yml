name: Windows full-static replay

on:
  workflow_dispatch:
  push:
    branches:
      - feat/full-static-sdk-cross-host
    paths:
      - '.github/workflows/windows-full-static-replay.yml'
      - 'src/Toolchain/**'
      - 'tests/**'
      - 'toolchain/**'
      - 'toolchain.lock.json'
      - 'tools/**'

permissions:
  contents: read

jobs:
  replay:
    name: Rebuild Linux x86-64 musl ELF
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout locked source
        uses: actions/checkout@v4

      - name: Run CLI-only Windows replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = Join-Path $env:RUNNER_TEMP 'webman-aot-artifacts'
          $workRoot = Join-Path $env:RUNNER_TEMP 'webman-aot-work'
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          & .\tools\windows-replay.ps1 `
            -Artifacts $artifacts `
            -WorkRoot $workRoot

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-static-replay-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/webman-aot-work/windows-replay.json
            ${{ runner.temp }}/webman-aot-work/probe/full_static_cross_smoke
