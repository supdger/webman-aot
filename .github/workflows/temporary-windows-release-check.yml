name: Temporary Windows 0.1.2 release check

on:
  push:
    branches:
      - fix/source-compare-revision

permissions:
  contents: read

jobs:
  windows-source-install-build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows installer and compare without a revision argument
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build-windows-installer.ps1 -Revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source build failed' }
          $archive = Join-Path $PWD 'dist\source-build\webman-aot-0.1.2-windows-x86_64.zip'
          $reference = Join-Path $env:RUNNER_TEMP 'source-build-reference.zip'
          Copy-Item -LiteralPath $archive -Destination $reference
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build-windows-installer.ps1 -Compare $reference
          if ($LASTEXITCODE -ne 0) { throw 'Source build comparison failed' }
          $extract = Join-Path $env:RUNNER_TEMP 'source-install'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar.exe -xf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'release-install'
          $binDir = Join-Path $env:RUNNER_TEMP 'release-bin'
          & (Join-Path $extract 'install.ps1') -InstallRoot $installRoot -BinDir $binDir -NoPath
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation failed' }
          $env:WEBMAN_AOT_HOME = $installRoot
          & (Join-Path $binDir 'webman-aot.cmd') version
          if ($LASTEXITCODE -ne 0) { throw 'Installed command failed' }

      - name: Repair toolchain and compile neutral Webman fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'release-install'
          $binDir = Join-Path $env:RUNNER_TEMP 'release-bin'
          $php = Join-Path $installRoot 'current\runtime\php.exe'
          $ini = Join-Path $installRoot 'current\runtime\php.ini'
          $env:WEBMAN_AOT_HOME = $installRoot
          $fixtureSource = Join-Path $env:RUNNER_TEMP 'fixture-source'
          git clone --depth 1 --branch feat/full-static-sdk-cross-host `
            https://github.com/supdger/webman-aot.git $fixtureSource
          if ($LASTEXITCODE -ne 0) { throw 'Neutral fixture checkout failed' }
          $fixture = Join-Path $fixtureSource 'tests\fixtures\minimal-webman'
          $composerSetup = Join-Path $env:RUNNER_TEMP 'composer-setup.php'
          $signatureFile = Join-Path $env:RUNNER_TEMP 'composer-installer.sig'
          Invoke-WebRequest -Uri https://composer.github.io/installer.sig -OutFile $signatureFile
          $composerSignature = (Get-Content -Raw $signatureFile).Trim()
          Invoke-WebRequest -Uri https://getcomposer.org/installer -OutFile $composerSetup
          if ((Get-FileHash $composerSetup -Algorithm SHA384).Hash.ToLowerInvariant() -ne $composerSignature) {
            throw 'Composer installer signature mismatch'
          }
          & $php -c $ini $composerSetup "--install-dir=$env:RUNNER_TEMP" --filename=composer.phar
          if ($LASTEXITCODE -ne 0) { throw 'Composer installation failed' }
          Push-Location $fixture
          try {
            & $php -c $ini (Join-Path $env:RUNNER_TEMP 'composer.phar') require `
              'workerman/webman-framework:2.2.4' -W `
              --no-interaction --no-progress --prefer-dist
            if ($LASTEXITCODE -ne 0) { throw 'Fixture dependency installation failed' }
            & (Join-Path $binDir 'webman-aot.cmd') doctor --repair
            if ($LASTEXITCODE -ne 0) { throw 'Locked toolchain repair failed' }
            & (Join-Path $binDir 'webman-aot.cmd') doctor
            if ($LASTEXITCODE -ne 0) { throw 'Toolchain is not healthy after repair' }
            & (Join-Path $binDir 'webman-aot.cmd') build
            if ($LASTEXITCODE -ne 0) { throw 'Neutral project build failed' }
            & (Join-Path $binDir 'webman-aot.cmd') verify
            if ($LASTEXITCODE -ne 0) { throw 'Neutral distribution verification failed' }
            & (Join-Path $env:RUNNER_TEMP 'source-install\uninstall.ps1') `
              -InstallRoot $installRoot -BinDir $binDir -Purge -NoPath
            if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $installRoot)) {
              throw 'Windows uninstall from the project directory failed'
            }
          } finally {
            Pop-Location
          }

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-install/logs/*/diagnostic.json
            ${{ runner.temp }}/release-install/logs/*/run.log
          if-no-files-found: warn
          retention-days: 7
