name: Windows release candidate check

on:
  push:
    branches:
      - release/v0.1.0

permissions:
  contents: read

jobs:
  package-install:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download locked inputs and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -Raw installer/runtime.lock.json | ConvertFrom-Json
          $toolchain = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          $source = $toolchain.components | Where-Object id -eq 'typephp-source' | Select-Object -First 1
          $inputDir = Join-Path $env:RUNNER_TEMP 'release-inputs'
          $outputDir = Join-Path $env:RUNNER_TEMP 'release-packages'
          New-Item -ItemType Directory -Force $inputDir, $outputDir | Out-Null
          $phpZip = Join-Path $inputDir 'php.zip'
          $typephpTar = Join-Path $inputDir 'typephp.tar.gz'
          Invoke-WebRequest -Uri $lock.runtimes.'windows-x86_64'.archiveUrl -OutFile $phpZip
          Invoke-WebRequest -Uri $source.sourceUrl -OutFile $typephpTar
          if ((Get-FileHash $phpZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.runtimes.'windows-x86_64'.archiveSha256) { throw 'PHP archive digest mismatch' }
          if ((Get-FileHash $typephpTar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) { throw 'TypePHP source digest mismatch' }
          $phpDir = Join-Path $inputDir 'php'
          New-Item -ItemType Directory -Force $phpDir | Out-Null
          tar.exe -xf $phpZip -C $phpDir
          if ($LASTEXITCODE -ne 0) { throw 'PHP archive extraction failed' }
          & (Join-Path $phpDir 'php.exe') -n `
            -d "extension_dir=$(Join-Path $phpDir 'ext')" -d extension=zip `
            tools/package-installers.php `
            --platform=windows-x86_64 `
            "--windows-runtime-archive=$phpZip" `
            "--typephp-source-archive=$typephpTar" `
            "--output=$outputDir" `
            "--revision=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Windows package creation failed' }
          $archive = Join-Path $outputDir 'webman-aot-0.1.0-windows-x86_64.zip'
          $installFiles = Join-Path $env:RUNNER_TEMP 'release-extract'
          New-Item -ItemType Directory -Force $installFiles | Out-Null
          tar.exe -xf $archive -C $installFiles
          if ($LASTEXITCODE -ne 0) { throw 'Package extraction failed' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'release-install'
          $binDir = Join-Path $env:RUNNER_TEMP 'release-bin'
          & (Join-Path $installFiles 'install.ps1') -InstallRoot $installRoot -BinDir $binDir -NoPath
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation failed' }
          $env:WEBMAN_AOT_HOME = $installRoot
          & (Join-Path $binDir 'webman-aot.cmd') version
          if ($LASTEXITCODE -ne 0) { throw 'Installed command failed' }
          $doctor = & (Join-Path $binDir 'webman-aot.cmd') doctor --json | ConvertFrom-Json
          $platform = $doctor.checks | Where-Object id -eq 'platform' | Select-Object -First 1
          $toolchainLock = $doctor.checks | Where-Object id -eq 'toolchain-lock' | Select-Object -First 1
          if ($platform.status -ne 'ok' -or $toolchainLock.status -ne 'ok') {
            throw 'Installed doctor did not recognize Windows or its locked toolchain'
          }
          Get-FileHash -Algorithm SHA256 $archive | Format-List
      - name: Upload checked Windows package
        uses: actions/upload-artifact@v4
        with:
          name: webman-aot-windows-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages/webman-aot-0.1.0-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
