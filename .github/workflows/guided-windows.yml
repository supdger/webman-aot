name: Guided Windows native acceptance

# Scoped feature-push acceptance; manual dispatch becomes available after default-branch registration.
# Fixture source and dependency versions are
# maintained in tools/fixtures/guided-webman; generated vendor stays in RUNNER_TEMP.
# Source publication and running this job require separate task authorization.
on:
  push:
    branches:
      - codex/guided-build-install
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-entries:
    if: github.ref == 'refs/heads/codex/guided-build-install'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare locked private fixture and run actual CMD entries
        shell: powershell
        run: |
          & .\tools\test-guided-windows.ps1 `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'guided-native') `
            -StepTimeoutSeconds 1800
          if ($LASTEXITCODE -ne 0) { throw "Native acceptance failed: $LASTEXITCODE" }

      - name: Preserve native stage results and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guided-native/logs/
            ${{ runner.temp }}/guided-native/temp/**/*.log
          if-no-files-found: warn
          retention-days: 7
